name: CI

# Builds the Pulumi program and the rollout gate and runs their unit tests on
# every pull request and on main. Nothing here talks to AWS or Pulumi Cloud:
# `pulumi preview` needs a stack's credentials, so deploys stay in deploy.yml.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      # The test project references both infra/pulumi and infra/rollout-gate,
      # so restoring, building and testing it covers all three projects.
      - name: Restore
        run: dotnet restore infra/pulumi.tests

      - name: Build
        run: dotnet build infra/pulumi.tests --configuration Release --no-restore

      - name: Test
        run: dotnet test infra/pulumi.tests --configuration Release --no-build
